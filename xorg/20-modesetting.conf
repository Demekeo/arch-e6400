# Fuerza el driver X "modesetting" para la Quadro NVS 160M (NV98).
#
# El kernel sigue usando nouveau para KMS; modesetting usa esa interfaz
# DRM y activa DRI3 + glamor. Con el driver "nouveau" GLX acaba en
# llvmpipe (Accelerated: no) en este equipo.
#
# Instalar (requiere sudo y reiniciar X):
#   sudo install -Dm644 xorg/20-modesetting.conf \
#     /etc/X11/xorg.conf.d/20-modesetting.conf
#
# Revertir si X no arranca:
#   sudo rm /etc/X11/xorg.conf.d/20-modesetting.conf
Section "Device"
    Identifier  "NV98"
    Driver      "modesetting"
    Option      "AccelMethod" "glamor"
    # DRI3 se activa solo cuando el servidor X y el driver lo soportan.
EndSection
