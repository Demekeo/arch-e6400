# ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 10, y = 10 }
opacity = 0.94
dynamic_title = true

[font]
size = 10
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }

[colors.primary]
background = "#0d1a25"
foreground = "#c0caf5"

[colors.cursor]
text = "#0d1a25"
cursor = "#7aa2f7"

[colors.normal]
black = "#0d1a25"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#c6a0f6"
cyan = "#91d7e3"
white = "#b8c0e0"

[colors.bright]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#c6a0f6"
cyan = "#91d7e3"
white = "#cad3f5"
