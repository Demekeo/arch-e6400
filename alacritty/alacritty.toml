# ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 12, y = 12 }
# Algo mas translucida para que se note el desenfoque de picom.
opacity = 0.88
dynamic_title = true

[font]
size = 10.5
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[colors.primary]
background = "#1e2030"
foreground = "#cad3f5"

[colors.cursor]
text = "#1e2030"
cursor = "#8aadf4"

[colors.normal]
black = "#181926"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#c6a0f6"
cyan = "#91d7e3"
white = "#b8c0e0"

[colors.bright]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#c6a0f6"
cyan = "#91d7e3"
white = "#cad3f5"
