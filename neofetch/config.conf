# ~/.config/neofetch/config.conf
# Version compacta para el Dell Latitude E6400.

ascii_distro="arch_small"
image_backend="ascii"
color_blocks="on"
bold="on"

print_info() {
    info title
    info underline
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Paquetes" packages
    info "Shell" shell
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memoria" memory
    info "Disco" disk
    info cols
}
