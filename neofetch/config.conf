# ~/.config/neofetch/config.conf
# neofetch con estilo Catppuccin Macchiato para el Dell Latitude E6400.

# --- Logo ---
image_backend="ascii"
image_source="$HOME/.config/neofetch/ascii.txt"
ascii_colors=(111 183 218)   # azul, malva y rosa de Catppuccin
ascii_bold="on"

# --- Texto ---
colors=(5 8 8 4 8 7)         # titulo, @, subrayado, etiquetas, ':', valores
bold="on"
underline_enabled="on"
underline_char="─"
separator=":"

# --- Bloques de color ---
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
col_offset="auto"

# --- Datos ---
os_arch="on"
kernel_shorthand="on"
uptime_shorthand="on"
memory_percent="on"
speed_shorthand="on"
cpu_cores="logical"
gpu_type="all"
disk_show=('/' '/home')
disk_subtitle="mount"
disk_percent="on"

battery_info() {
    local cap status bat
    for bat in /sys/class/power_supply/BAT*; do
        [[ -r "$bat/capacity" ]] || continue
        cap="$(cat "$bat/capacity" 2>/dev/null)"
        status="$(cat "$bat/status" 2>/dev/null)"
        break
    done

    case "$status" in
        Charging)       status="cargando" ;;
        Discharging)    status="descargando" ;;
        "Not charging") status="en pausa" ;;
        Full)           status="completa" ;;
    esac

    [[ "$cap" ]] && printf '%s%% (%s)' "$cap" "$status"
}

print_info() {
    info title
    info underline
    info "Sistema" distro
    info "Núcleo" kernel
    info "Uptime" uptime
    info "Paquetes" packages
    info "Shell" shell
    info "Escritorio" wm
    info "Pantalla" resolution
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memoria" memory
    info "Disco" disk
    prin "Batería" "$(battery_info)"
    info "Red" local_ip
    info cols
}
