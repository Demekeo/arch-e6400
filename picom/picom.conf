# ~/.config/picom/picom.conf
# Compositor para awesome en una Quadro NVS 160M (nouveau).
# Sin blur: es lo que mas pesa en esta GPU.

backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

corner-radius = 8;
detect-rounded-corners = true;

blur-background = false;

frame-opacity = 1.0;
inactive-opacity = 1.0;
fading = false;

# Si ves tearing o tirones, cambia vsync a false.
# Si va lento, sube shadow a false y corner-radius a 0.

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
  normal = { opacity = 1.0; };
};
