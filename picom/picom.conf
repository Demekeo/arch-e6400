# ~/.config/picom/picom.conf
# Compositor para awesome en una Quadro NVS 160M (nouveau / G98M).
#
# IMPORTANTE: en esta GPU (G98M) el backend "glx" congela la pantalla:
# picom se queda sin repintar y solo ves cambios al mover/cambiar ventanas.
# "xrender" es estable, pero el desenfoque usa convolucion en el servidor X
# y consume ~90% de CPU en reposo (medido con gaussian y box, blur-size 3-9).
# Por eso el blur esta desactivado: la transparencia, las sombras y las
# esquinas redondeadas se mantienen.
#
# Salida de emergencia sin tocar nada:  touch ~/.config/picom/off
# y recarga awesome (Mod+Ctrl+r). Asi no se lanza picom.

backend = "xrender";
vsync = false;
unredir-if-possible = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.30;
shadow-offset-x = -8;
shadow-offset-y = -8;
# La barra es un dock: no necesita sombra sobre el borde de la pantalla.
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

corner-radius = 10;
detect-rounded-corners = true;

# Sin blur. Ojo: no basta con "blur-background = false"; si quedan opciones
# blur-* en el archivo, esta version de picom sigue blurrando y Xorg sube
# al 90%. Hay que quitar todas las lineas blur-*. Solo la terminal ya
# costaba ~60%; la barra + la terminal, ~90%.

frame-opacity = 1.0;
inactive-opacity = 1.0;
fading = false;

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
  normal = { opacity = 1.0; };
};
