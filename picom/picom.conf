# ~/.config/picom/picom.conf
# Compositor para awesome en una Quadro NVS 160M (nouveau / G98M).
# Sin blur: es lo que mas pesa en esta GPU.
#
# IMPORTANTE: en esta GPU (G98M) el backend "glx" congela la pantalla:
# picom se queda sin repintar y solo ves cambios al mover/cambiar ventanas.
# "xrender" es mas lento pero estable aqui. Si algun dia quieres probar glx,
# hazlo con vsync = false y comprueba que la terminal se repinta sola.
#
# Salida de emergencia sin tocar nada:  touch ~/.config/picom/off
# y recarga awesome (Mod+Ctrl+r). Asi no se lanza picom.

backend = "xrender";
vsync = false;
unredir-if-possible = false;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

corner-radius = 8;
detect-rounded-corners = true;

blur-background = false;

frame-opacity = 1.0;
inactive-opacity = 1.0;
fading = false;

# Si va lento, pon shadow = false y corner-radius = 0 (es lo que mas pesa).
# Con backend xrender, "vsync" no se usa realmente: dejalo en false.

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
  normal = { opacity = 1.0; };
};
