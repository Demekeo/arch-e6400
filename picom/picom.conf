# ~/.config/picom/picom.conf
# Compositor para awesome en una Quadro NVS 160M (nouveau / G98M).
#
# IMPORTANTE: en esta GPU (G98M) el backend "glx" congela la pantalla:
# picom se queda sin repintar y solo ves cambios al mover/cambiar ventanas.
# "xrender" es mas lento pero estable aqui. El desenfoque de xrender usa
# convolucion en el servidor X: si notas tirones, baja blur-size o pon
# blur-background = false.
#
# Salida de emergencia sin tocar nada:  touch ~/.config/picom/off
# y recarga awesome (Mod+Ctrl+r). Asi no se lanza picom.

backend = "xrender";
vsync = false;
unredir-if-possible = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.30;
shadow-offset-x = -8;
shadow-offset-y = -8;
# La barra es un dock: no necesita sombra sobre el borde de la pantalla.
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

corner-radius = 10;
detect-rounded-corners = true;

# Efecto vidrio: desenfoque gaussiano detras de la barra y la terminal.
# Xrender no soporta dual_kawase; gaussian funciona y es suficiente aqui.
blur-background = true;
blur-method = "gaussian";
blur-size = 9;
blur-deviation = 4.0;
blur-background-fixed = true;
blur-background-exclude = [ "window_type = 'desktop'" ];

frame-opacity = 1.0;
inactive-opacity = 1.0;
fading = false;

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
  normal = { opacity = 1.0; };
};
