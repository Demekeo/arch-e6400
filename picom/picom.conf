# ~/.config/picom/picom.conf
# Compositor para awesome en una Quadro NVS 160M (nouveau / G98M).
# Sin blur: es lo que mas pesa en esta GPU.
#
# IMPORTANTE: vsync = false en esta GPU.
# Con vsync activado, nouveau a veces no entrega el vblank y picom se queda
# esperando: la pantalla NO se repinta hasta que mueves o cambias de ventana.
# Si aun asi parpadea o se congela, prueba backend = "xrender" (mas lento
# pero mas fiable en GPUs viejas).
#
# Nota: "unredir-if-possible" esta desactivado a proposito; en nouveau
# tambien provoca pantallas congeladas al entrar en pantalla completa.

backend = "glx";
vsync = false;
unredir-if-possible = false;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

corner-radius = 8;
detect-rounded-corners = true;

blur-background = false;

frame-opacity = 1.0;
inactive-opacity = 1.0;
fading = false;

# Si ves tearing, prueba vsync = true (pero vigila que la pantalla siga
# actualizandose). Si va lento, pon shadow = false y corner-radius = 0.

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
  normal = { opacity = 1.0; };
};
